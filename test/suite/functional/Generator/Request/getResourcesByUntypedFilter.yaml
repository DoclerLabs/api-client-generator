openapi: 3.0.0
info:
  version: 1.0.0
  title: Example API
paths:
  '/v1/resources-by-untyped-filter':
    get:
      description: Get resources filtered by an untyped (mixed) query parameter
      operationId: getResourcesByUntypedFilter
      parameters:
        - name: filter
          in: query
          required: false
          schema: {}
      responses:
        '200':
          description: list of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
