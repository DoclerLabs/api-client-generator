openapi: 3.0.0
info:
  version: 1.0.0
  title: Example API
paths:
  '/v1/resources-by-statuses':
    get:
      description: Get resources filtered by arrays of enum values
      operationId: getResourcesByStatuses
      parameters:
        - name: types
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              enum:
                - basic
                - premium
        - name: statuses
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - active
                - inactive
                - +7 days
      responses:
        '200':
          description: list of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
